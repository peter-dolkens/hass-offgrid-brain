# Home Assistant add-on manifest. Installs into a supervised HAOS instance.
name: Off-Grid Brain
version: "0.6.0"
slug: offgrid_brain
description: >-
  Load-shedding and dispatch brain for an off-grid solar + battery house. Walks
  one dispatch list of charge rungs and loads every tick, reading battery SoC from
  an SP PRO bridge or any Home Assistant entity, and fails austere when it can't.
url: https://github.com/peter-dolkens/hass-offgrid-brain
arch:
  - aarch64
  - amd64
  - armv7
init: false
# WebSocket + REST access to HA core (read states, call services).
homeassistant_api: true
hassio_api: true
# Web UI in the HA sidebar: live view of each dispatch walk, and the policy editor.
# Ingress means HA authenticates it (admin-only panel); no port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: Off-Grid Brain
# Own config dir at /config — holds policy.json (the dispatch list).
map:
  - addon_config:rw
# Optional: only needed when mqtt.enabled is true.
services:
  - mqtt:want

options:
  dry_run: true
  tick_seconds: 5
  log_level: info
  sources:
    battery_soc: ""
    pv_power: ""
    load_power: ""
    outdoor_temp: ""
    pv_forecast_today: ""
  battery:
    capacity_kwh: 51.8
    inverter_kw: 7.5
    max_charge_kw: 7.5
    reserve_pct: 10
  autonomy:
    seed_load_kwh: 30
    window_days: 7
  splink:
    enabled: false
    urls: []
    poll_seconds: 15
    fast_seconds: 3
    access_client_id: ""
    access_client_secret: ""
  fronius:
    enabled: false
    hosts: []
    poll_seconds: 10
    publish_to_ha: false
  mqtt:
    enabled: false
    discovery_prefix: homeassistant
    host: ""
    port: 1883
    username: ""
    password: ""
  devices: []

schema:
  # Master safety switch. true = decide and log, actuate NOTHING.
  dry_run: bool
  tick_seconds: int(2,300)
  log_level: list(debug|info|warn|error)
  # Logical name -> HA entity_id. Every one optional; absent sources degrade safely.
  sources:
    battery_soc: str?
    pv_power: str?
    load_power: str?
    outdoor_temp: str?
    pv_forecast_today: str?
  battery:
    capacity_kwh: float
    inverter_kw: float
    max_charge_kw: float
    reserve_pct: int(0,50)
  autonomy:
    seed_load_kwh: float
    window_days: int(1,30)
  # SP PRO bridge (splink-cli JSON API): battery SoC, AC load and Fronius PV in one
  # read. urls are tried in order — list the LAN address first and a tunnel second.
  splink:
    enabled: bool
    urls:
      - url
    poll_seconds: int(5,300)
    # The bridge's /fast window (SoC + load), re-read every few seconds for shedding.
    # 0 turns it off; a bridge without /fast is detected and skipped automatically.
    fast_seconds: int(0,60)
    # Cloudflare Access service token, if the tunnel is behind Access.
    access_client_id: str?
    access_client_secret: password?
  fronius:
    enabled: bool
    hosts:
      - str
    poll_seconds: int(5,300)
    publish_to_ha: bool
  # Publishes the brain's state as an "Off-Grid Brain" device via MQTT discovery.
  # Leave host blank to use the Mosquitto add-on's own credentials.
  mqtt:
    enabled: bool
    discovery_prefix: str
    host: str?
    port: port?
    username: str?
    password: password?
  # Controllable loads. `id` must match a device id used in policy.json.
  devices:
    - id: str
      name: str?
      kw: float
      switch: str?
      power_sensor: str?
      min_dwell_seconds: int?
