# Home Assistant add-on manifest. Installs into a supervised HAOS instance.
name: Off-Grid Brain
version: "0.18.2"
slug: offgrid_brain
description: >-
  Load-shedding and dispatch brain for an off-grid solar + battery house. Walks
  one dispatch list of charge rungs and loads every tick, reading battery SoC from
  an SP PRO bridge or any Home Assistant entity, and fails austere when it can't.
url: https://github.com/peter-dolkens/hass-offgrid-brain
arch:
  - aarch64
  - amd64
  - armv7
init: false
# WebSocket + REST access to HA core (read states, call services).
homeassistant_api: true
hassio_api: true
# Web UI in the HA sidebar: live view of each dispatch walk, and the policy editor.
# Ingress means HA authenticates it (admin-only panel); no port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: Off-Grid Brain
# Own config dir at /config — holds policy.json (the dispatch list).
map:
  - addon_config:rw
# Optional: only needed when mqtt.enabled is true.
services:
  - mqtt:want

# The brain is configured from its web panel (Settings tab). These options hold
# only the log level and the MQTT credentials, which are never served to the web panel.
options:
  log_level: info
  mqtt:
    enabled: false
    discovery_prefix: homeassistant
    host: ""
    port: 1883
    username: ""
    password: ""

schema:
  log_level: list(debug|info|warn|error)
  # Publishes the brain's state as an "Off-Grid Brain" device via MQTT discovery.
  # Leave host blank to use the Mosquitto add-on's own credentials.
  mqtt:
    enabled: bool
    discovery_prefix: str
    host: str?
    port: port?
    username: str?
    password: password?
